.orb i,.orb b{position:absolute;border-radius:50%;animation:spin 14s linear infinite}.orb i{inset:0;border:1px dashed #8B5CF6}.orb b{inset:16px;border:1px solid rgba(255,154,60,.35);animation-duration:22s;animation-direction:reverse}
.orb i:after,.orb b:after{content:"";position:absolute;top:-6px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#D9B8FF;box-shadow:0 0 14px #D9B8FF}.orb b:after{background:#FF9A3C;box-shadow:0 0 14px #FF9A3C}

.tk{direction:ltr;overflow:hidden;border-block:1px solid #4a2a80;background:rgba(26,10,54,.6);margin-top:40px}.tk div{display:flex;gap:44px;width:max-content;padding:13px 0;animation:mq 45s linear infinite;color:var(--tx2);font-weight:600}.tk span:after{content:"✦";margin-inline-start:44px;color:var(--ac)}@keyframes mq{to{transform:translateX(-50%)}}
.sb{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;padding-top:36px;padding-bottom:10px}.sn b{display:block;font-size:clamp(34px,5vw,56px);line-height:1;font-weight:800;background:linear-gradient(90deg,#FF9A3C,#FF5FA2);-webkit-background-clip:text;background-clip:text;color:transparent}.sn span{color:var(--tx2);font-size:15px}
.eng{display:grid;grid-template-columns:1fr 1.1fr;gap:28px;align-items:center}.engi{width:100%;border-radius:16px;border:1px solid #6a3fb8;aspect-ratio:16/10}.parts{display:grid;gap:10px}
.pt{all:unset;box-sizing:border-box;cursor:pointer;display:block;border:1px solid #6a3fb8;border-radius:12px;padding:12px 16px;background:var(--card);transition:transform .3s,border-color .3s,background .3s}.pt b{display:block}.pt span{display:block;max-height:0;overflow:hidden;opacity:0;color:var(--tx2);font-size:15px;transition:max-height .4s,opacity .4s,margin .4s}
.pt.on{border-color:var(--ac);background:#3a1d6e;transform:translateX(-10px)}[dir=rtl] .pt.on{transform:translateX(10px)}.pt.on span{max-height:220px;opacity:1;margin-top:6px}.pt:focus-visible{outline:2px solid var(--ac)}
.sqh{margin:34px 0 0}.sq{list-style:none;margin:16px 0 20px;padding:0!important;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.sq li{border-top:3px solid #4a2a80;padding-top:10px;color:var(--tx2);font-size:15px;opacity:.3;transform:translateY(12px)}.sq li i{display:block;font-style:normal;color:var(--ac);font-weight:800}
.sq.go li{animation:lit .6s calc(var(--i)*1s) forwards}@keyframes lit{to{opacity:1;transform:none;border-color:#FF9A3C}}
.sp{position:fixed;width:5px;height:5px;margin:-2px;border-radius:50%;background:#FF9A3C;pointer-events:none;z-index:30;animation:spk .7s ease-out forwards}@keyframes spk{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
@media(max-width:860px){.eng{grid-template-columns:1fr}.orb{display:none}.sb{grid-template-columns:1fr 1fr}}

.Titan{color:#FFB067}.Earth{color:#7DD3FC}.pill.Titan{background:#9a4a0e;color:#fff}.pill.Earth{background:#1e4a8f;color:#fff}

/* ECHOES immersive planetary journeys — preserves the original purple/gold identity */
.world-picks{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin:30px 0 56px}
.world-pick{position:relative;min-height:340px;overflow:hidden;border:1px solid #6a3fb8;border-radius:22px;background:linear-gradient(145deg,#251044,#100821);display:flex;align-items:flex-end;padding:28px;isolation:isolate;transition:transform .35s,border-color .35s,box-shadow .35s}
.world-pick:hover{transform:translateY(-5px);border-color:var(--ac);box-shadow:0 22px 55px #09031699}
.world-pick .planet{position:absolute;width:310px;height:310px;border-radius:50%;right:5%;top:-36px;z-index:-1;box-shadow:inset -38px -20px 65px #080512aa,0 0 75px #b16b4844;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.world-pick:hover .planet{transform:scale(1.13) translateX(-10px)}
.world-pick.mars .planet{background:radial-gradient(circle at 32% 28%,#f4b18a 0 5%,#bd654b 24%,#8d3c31 58%,#351b2a 100%),repeating-radial-gradient(ellipse at 45% 50%,#fff2 0 2px,transparent 3px 13px)}
.world-pick.moon .planet{background:radial-gradient(circle at 32% 28%,#e5e0d5 0 4%,#aaa9a6 28%,#666a78 65%,#27243a 100%),repeating-radial-gradient(ellipse at 45% 50%,#fff2 0 2px,transparent 3px 13px)}
.world-pick .planet:after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(ellipse at 20% 25%,#fff3,transparent 38%),radial-gradient(ellipse at 70% 75%,#08051288,transparent 50%)}
.world-pick .copy{max-width:390px;text-shadow:0 2px 18px #090316}

.world-pick .go{display:inline-flex;align-items:center;gap:10px;color:var(--ac);font-weight:800;margin-top:12px}
.world-intro{position:relative;min-height:100vh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 65%,#3b1d70 0,transparent 48%),linear-gradient(#10071f,#1b0b35);text-align:center}
.world-intro:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:47px 47px;opacity:.24;mask-image:linear-gradient(transparent,#000 30%,#000)}
.world-intro .intro-copy{position:relative;z-index:2;padding:90px 22px 150px;max-width:850px}
.world-intro h1{font-size:clamp(42px,8vw,88px);line-height:1.02;margin:14px 0}
.world-intro p{font-size:clamp(17px,2vw,21px);color:var(--tx2);max-width:640px;margin:0 auto}
.world-intro .planet-big{position:absolute;width:min(75vw,680px);aspect-ratio:1;border-radius:50%;top:56%;left:50%;transform:translate(-50%,-50%);opacity:.6;filter:blur(.2px);box-shadow:inset -90px -40px 110px #090316cc,0 0 100px #a56ad044;transition:transform .2s}
.world-intro.mars .planet-big{background:radial-gradient(circle at 34% 25%,#e9a47b,#b75d45 38%,#73352f 73%,#2b172b)}
.world-intro.moon .planet-big{background:radial-gradient(circle at 34% 25%,#e8e4d8,#a6a5a4 38%,#676a78 73%,#29263a)}
.world-intro .scroll-cue{display:inline-flex;flex-direction:column;align-items:center;gap:8px;margin-top:38px;color:var(--tx2);font-size:13px;letter-spacing:.08em}
.world-intro .scroll-cue i{width:26px;height:42px;border:1px solid #dcccf5aa;border-radius:20px;position:relative}
.world-intro .scroll-cue i:after{content:"";position:absolute;width:4px;height:8px;left:10px;top:8px;border-radius:4px;background:var(--ac);animation:scrollDot 1.5s infinite}
@keyframes scrollDot{to{transform:translateY(15px);opacity:0}}
.journey{position:relative;background:linear-gradient(#120824,#1a0b32 45%,#120824);padding:70px 0 100px}
.journey-head{max-width:800px;margin:0 auto 36px;text-align:center;padding:0 20px}
.journey-head p{color:var(--tx2)}
.journey-grid{max-width:1180px;margin:auto;padding:0 24px;display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,.9fr);gap:36px;align-items:start}
.journey-visual{position:sticky;top:90px;height:min(72vh,650px);min-height:440px;border:1px solid #6844a1;border-radius:24px;overflow:hidden;background:radial-gradient(ellipse at 50% 55%,#39205d,#160b2c 68%);box-shadow:0 25px 65px #08031188}
.journey-visual .terrain{position:absolute;left:-10%;right:-10%;bottom:-4%;height:42%;background:linear-gradient(165deg,transparent 0 12%,#382342 13% 22%,#24162f 23% 40%,#140e23 41%);clip-path:polygon(0 35%,14% 12%,27% 33%,42% 3%,58% 32%,74% 8%,100% 29%,100% 100%,0 100%)}
.journey-visual.mars .terrain{background:linear-gradient(165deg,#a85b42,#673a3b 35%,#25172e 100%)}
.journey-visual.moon .terrain{background:linear-gradient(165deg,#a5a4a8,#666477 35%,#28243b 100%)}
.journey-visual .horizon{position:absolute;left:-20%;right:-20%;bottom:27%;height:1px;background:#f4d8bd55;box-shadow:0 0 25px #ffb16b55}
.journey-visual .vehicle-art{position:absolute;left:50%;bottom:22%;width:min(80%,420px);height:190px;transform:translateX(-50%);transition:transform .65s,opacity .4s;filter:drop-shadow(0 16px 16px #09031688)}
.journey-visual .vehicle-art svg{width:100%;height:100%;overflow:visible}
.journey-visual .visual-label{position:absolute;left:20px;right:20px;top:18px;display:flex;justify-content:space-between;gap:10px;color:#f7eaff;font-size:12px;letter-spacing:.12em}
.journey-visual .stars{position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:39px 39px;opacity:.28}
.journey-visual .dust{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 100%,#f4c39b22,transparent 55%);pointer-events:none}

.journey-step{min-height:64vh;display:flex;flex-direction:column;justify-content:center;padding:30px;border:1px solid #60408f;border-radius:20px;background:linear-gradient(145deg,#2b1750ed,#170d2beF);opacity:.58;transform:scale(.97);transition:opacity .45s,transform .45s,border-color .45s,box-shadow .45s}

.journey-step .story-link{margin-top:18px;color:var(--ac);font-weight:800}
.journey-end{text-align:center;padding:65px 20px 20px}
.journey-end p{color:var(--tx2)}
.journey-progress{position:fixed;z-index:12;bottom:18px;left:50%;transform:translateX(-50%);padding:9px 15px;border:1px solid #7351a3;border-radius:30px;background:#160b2be8;backdrop-filter:blur(12px);color:#fff;font-size:12px;display:none;gap:10px;align-items:center}
.journey-progress.show{display:flex}.journey-progress .track{width:90px;height:4px;border-radius:4px;background:#493263;overflow:hidden}.journey-progress .track i{display:block;height:100%;width:0;background:linear-gradient(90deg,#b98cff,#ffb05c);transition:width .2s}
@media(max-width:860px){.world-picks{grid-template-columns:1fr}.world-pick{min-height:300px}.world-pick .planet{width:250px;height:250px;right:-8%;top:-20px}.journey-grid{grid-template-columns:1fr}.journey-visual{position:sticky;top:76px;height:34vh;min-height:240px;z-index:2}.journey-visual .vehicle-art{height:120px;bottom:15%}.journey-step{min-height:54vh;padding:23px}.journey-steps{gap:12px}.journey-head{margin-bottom:24px}}

{id:"apollo11",name:"Apollo 11 Laser Retroreflector",world:"Moon",type:"Scientific instrument",kind:"instrument",mission:"Apollo 11",period:"Deployed July 1969",status:"Passive instrument — remains on the Moon",
short:"A passive array of corner-cube reflectors that bounces laser light back toward Earth.",tag:"A passive instrument that still helps us measure the Moon.",
img:"",credit:"Add a NASA image (e.g. from images.nasa.gov) and credit it here.",
story:["In July 1969, Apollo 11 astronauts Neil Armstrong and Buzz Aldrin landed at Tranquility Base on the Moon. Among the equipment they set up on the surface was a small package of science experiments — and one of them needed no power at all.","NASA sent the retroreflector so scientists could measure the distance to the Moon with extreme precision, using lasers fired from Earth."],
facts:[["Mission","Apollo 11"],["Launch","July 16, 1969"],["Landing","July 20, 1969"],["Deployment","July 21, 1969 (UTC), Tranquility Base"],["Location","The Moon — Sea of Tranquility"],["Objective","Reflect laser light for lunar laser ranging"],["End of mission","Not applicable — passive instrument"],["Status","Passive; remains on the Moon"]],
how:["A retroreflector is built from corner-cube reflectors: three mirror-like surfaces meeting at right angles. Light that enters a corner cube bounces back parallel to the direction it came from — straight toward its source.","It has no engine, no battery and no radio. It does not communicate with Earth by itself. Instead, scientists aim a pulsed laser at it from an observatory and time how long the light takes to make the round trip. Because the speed of light is known, that time gives the Earth–Moon distance.","This is why it is so different from a rover: nothing inside it is working. Its design is the whole point."],
tl:[["July 16, 1969","Apollo 11 launches toward the Moon"],["July 20, 1969","Lunar module lands at Tranquility Base"],["July 21, 1969","Astronauts deploy the retroreflector on the surface"]],
disc:["Repeated laser ranging measurements let scientists track the Earth–Moon distance over time and study how the Moon moves and orbits.","These measurements are also used to test ideas in physics and to learn about the Moon’s interior. Later missions placed other reflectors on the Moon, so Apollo 11’s is one of several."],
rem:["The reflector stayed where the astronauts left it. Because it is passive, it falls in the category of equipment that remains useful for measurements without any power of its own.","We do not claim every laser attempt succeeds — ranging is technically difficult — but the reflector’s legacy is a long scientific record built on a very simple device."],
src:[["ILRS — Apollo 11 reflector","https://ilrs.gsfc.nasa.gov/missions/satellite_missions/current_missions/ap11_reflector.html"],["NASA Goddard — Lunar laser ranging","https://pgda.gsfc.nasa.gov/products/100"]]},
{id:"sojourner",name:"Sojourner Rover",world:"Mars",type:"Robotic rover",kind:"rover",mission:"Mars Pathfinder",period:"1996 – 1997",status:"Mission complete",
short:"The first rover to drive on Mars — a small technology demonstration with a big impact.",tag:"A small rover with a big impact.",
img:"",credit:"Add a NASA/JPL image and credit it here.",
story:["Sojourner was a small six-wheeled rover that travelled to Mars aboard the Mars Pathfinder mission. It was designed first as a technology demonstration: could a rover work on another planet’s surface?","It is important to separate the two machines. The Pathfinder lander delivered Sojourner and relayed its data to Earth. Sojourner was the rover that drove off and explored."],
facts:[["Mission","Mars Pathfinder"],["Launch","December 4, 1996"],["Landing","July 4, 1997"],["Location","Mars — Ares Vallis region"],["Objective","Demonstrate a low-cost landing and rover technology; study rocks and soil"],["Final data transmission","September 27, 1997 (Pathfinder)"],["Status","Mission complete"]],
how:["Sojourner moved on six wheels, built to cope with rocky ground. It stayed within range of the lander and depended on it for communications with Earth.","Its instruments included cameras and an alpha proton X-ray spectrometer used to learn the chemical makeup of rocks and soil it touched.","The September 27, 1997 date marks the final Pathfinder data transmission — the lander’s last contact — not a separate end date for the rover."],
tl:[["December 4, 1996","Mars Pathfinder launches"],["July 4, 1997","Pathfinder lands on Mars"],["July 1997","Sojourner begins exploring around the lander"],["September 27, 1997","Final Pathfinder data transmission"]],
disc:["Sojourner proved that a rover could drive, survive and make science measurements on Mars.","Its results on rocks and soil helped plan later missions, and its success paved the way for later, larger Mars rovers."],
rem:["Sojourner and the Pathfinder lander remain on Mars. They are inactive: their mission is complete and they no longer send data.","The lander and rover are two separate objects, each part of the same historic mission."],
src:[["NASA Science — Mars Pathfinder","https://science.nasa.gov/mission/mars-pathfinder/"],["NASA JPL — Pathfinder / Sojourner","https://www.jpl.nasa.gov/missions/mars-pathfinder-sojourner-rover/"],["JPL Robotics — Sojourner","https://www-robotics.jpl.nasa.gov/what-we-do/flight-projects/pathfinder/"]]},
{id:"opportunity",name:"Opportunity Rover",world:"Mars",type:"Robotic rover",kind:"rover",mission:"Mars Exploration Rover (MER-B)",period:"2003 – 2019",status:"Mission complete",
short:"A solar-powered rover that explored Mars for years and found evidence of ancient water.",tag:"A long journey of discovery.",
img:"",credit:"Add a NASA/JPL image and credit it here.",
story:["Opportunity was one of two Mars Exploration Rovers sent to look for evidence that liquid water once shaped the surface of Mars.","Designed for a short mission, it kept going for years — one of the longest journeys ever made by a machine on another world."],
facts:[["Mission","Mars Exploration Rover (MER-B)"],["Launch","July 7, 2003"],["Landing","January 24, 2004"],["Location","Meridiani Planum, Mars"],["Objective","Search for evidence of past water"],["Last communication","June 10, 2018"],["Mission declared complete","February 13, 2019"],["Status","Mission complete — not operating"]],
how:["Opportunity ran on solar panels, which charged its batteries. This made it dependent on sunlight reaching its panels.","Its tools included cameras, spectrometers and a rock abrasion tool to look inside rocks. These let it study the minerals and chemistry of rocks and terrain."],
tl:[["July 7, 2003","Opportunity launches"],["January 24, 2004","Lands on Mars"],["June 10, 2018","Last communication, during a global dust storm"],["February 13, 2019","NASA declares the mission complete"]],
disc:["Opportunity found evidence that water once existed at its landing region on ancient Mars.","Its long operational life gave scientists a detailed record of Martian rocks and terrain."],
rem:["In 2018 a huge dust storm blocked sunlight and the rover stopped communicating. After many attempts to contact it, NASA declared the mission complete on February 13, 2019.","Opportunity remains on Mars. It is inactive and is not operating. The last communication (June 10, 2018) and the end declaration (February 13, 2019) are different dates."],
src:[["NASA Science — Opportunity","https://science.nasa.gov/mission/mer-opportunity/"],["NASA — Opportunity mission end","https://www.nasa.gov/news-release/nasas-record-setting-opportunity-rover-mission-on-mars-comes-to-end/"]]}

A.push({id:"mco",name:L("Mars Climate Orbiter","مدار المناخ المريخي"),world:"Mars",type:"Orbiter",kind:"orbiter",mission:MS,period:"1998 – 1999",status:L("Lost on arrival — never reached orbit","فُقد عند الوصول — لم يبلغ المدار"),
short:L("A weather satellite built for Mars, lost on arrival because of a units mix-up.","قمر طقس صُنع للمريخ، فُقد عند وصوله بسبب خلط في وحدات القياس."),tag:L("Lost to a units mix-up.","فُقد بسبب خلط الوحدات."),img:ART.mco,credit:CR,
story:[L("Mars Climate Orbiter was meant to watch Mars’s weather and to relay messages from the Mars Polar Lander. After nine months of flight it reached Mars on September 23, 1999 and began the burn that should have put it into orbit.","كان مدار المناخ المريخي مخصصًا لمراقبة طقس المريخ ونقل رسائل الهبّاطة «مارس بولار لاندر». بعد تسعة أشهر من الرحلة وصل المريخ في 23 سبتمبر 1999 وبدأ الحرق الذي كان سيضعه في المدار."),L("Its path was lower than planned. It passed through the thin upper atmosphere and was lost; the investigation board found that data about its thruster firings had been sent in pound-force seconds where newton-seconds were expected.","كان مساره أخفض من المخطط، فدخل الغلاف الجوي العلوي وفُقد. وجدت لجنة التحقيق أن بيانات إطلاق دافعاته أُرسلت بوحدة «باوند-قوة ثانية» بدل «نيوتن ثانية» المتوقعة.")],
facts:[["Mission",MS],["Launch","December 11, 1998"],[L("Arrival","الوصول"),"September 23, 1999"],[L("Mass","الكتلة"),L("About 630 kg with fuel","نحو 630 كجم مع الوقود")],["Objective",L("Study Mars’s weather and relay for the Mars Polar Lander","دراسة طقس المريخ ونقل رسائل مارس بولار لاندر")],[L("Last signal","آخر إشارة"),"September 23, 1999, 09:04:52 UTC"]],
how:[L("A box-shaped body about 2.1 m tall, with one 5.5 m solar wing, a 1.3 m dish antenna and a 640 N main engine for the orbit burn.","جسم صندوقي بارتفاع نحو 2.1 م، بجناح شمسي واحد طوله 5.5 م، وطبق هوائي قطره 1.3 م، ومحرك رئيسي 640 نيوتن لحرق الدخول في المدار."),L("Three reaction wheels kept it pointed. When they built up too much spin, small thrusters fired to release it. Those firings were logged — in the wrong units.","ثلاث عجلات رد فعل كانت تُبقي توجيهها. وحين يتراكم عليها دوران زائد تُطلق دافعات صغيرة لتفريغه، وكانت هذه الإطلاقات تُسجَّل — بالوحدات الخطأ.")],
x:[[L("Two systems of units","نظامان للوحدات"),L("One side used newton-seconds, the other pound-force seconds — a factor of about 4.45.","جهة استخدمت نيوتن ثانية وأخرى باوند-قوة ثانية — بفارق نحو 4.45 مرة.")],[L("A lopsided craft","مركبة غير متماثلة"),L("With one solar wing, sunlight pushed it unevenly, so wheel releases ran 10–14 times more often than the navigators expected.","بجناح شمسي واحد دفعها الضوء بشكل غير متساوٍ، فتكرر تفريغ العجلات 10–14 ضعف ما توقعه الملاحون.")],[L("A lesson for later missions","درس للمهام التالية"),L("The board said checks of ground software and units were not thorough enough.","قالت اللجنة إن مراجعة برمجيات الأرض والوحدات لم تكن كافية.")]],
tl:[["December 11, 1998",L("Launches on a Delta II","تنطلق على صاروخ دلتا 2")],["September 23, 1999",L("Orbit burn starts; contact lost behind Mars","يبدأ حرق المدار؛ ينقطع الاتصال خلف المريخ")],["November 10, 1999",L("Investigation board publishes its first report","لجنة التحقيق تنشر تقريرها الأول")]],
disc:[L("It returned no science: its two instruments, an infrared radiometer (PMIRR) and a color camera (MARCI), never began work.","لم تُرسل أي علوم: جهازاها، مقياس الأشعة تحت الحمراء (PMIRR) وكاميرا الألوان (MARCI)، لم يبدآ العمل."),L("Its legacy is a spotlight on checking units and ground software.","إرثها هو تسليط الضوء على مراجعة الوحدات وبرمجيات الأرض.")],
rem:[L("Nothing remains in orbit. The craft is believed to have broken up in Mars’s atmosphere.","لا يوجد شيء في المدار؛ يُعتقد أن المركبة تفككت في غلاف المريخ الجوي."),L("A camera of the same name, MARCI, later flew on Mars Reconnaissance Orbiter.","كاميرا بالاسم نفسه، MARCI، طارت لاحقًا على مدار الاستطلاع المريخي.")],
src:[[LS("NASA — Mishap Investigation Board, Phase I report","ناسا — تقرير لجنة التحقيق، المرحلة الأولى"),"https://llis.nasa.gov/llis_lib/pdf/1009464main1_0641-mr.pdf"],SRC],
eng:[[L("Body: stacked modules","الجسم: وحدات متراصة"),L("A box about 2.1 × 1.6 × 2.0 m built from a propulsion module and an equipment module.","صندوق نحو 2.1 × 1.6 × 2.0 م من وحدة دفع ووحدة معدات.")],[L("Main engine","المحرك الرئيسي"),L("A 640 N engine burning hydrazine and nitrogen tetroxide, made for the orbit burn.","محرك 640 نيوتن يحرق الهيدرازين ورباعي أكسيد النيتروجين، صُنع لحرق الدخول في المدار.")],[L("One solar wing","جناح شمسي واحد"),L("Three panels, 5.5 m long, about 500 W at Mars. Only one wing, so sunlight pushed it unevenly.","ثلاث ألواح بطول 5.5 م، نحو 500 واط عند المريخ. جناح واحد فقط، فدفعها الضوء بشكل غير متساوٍ.")],[L("Wheels and thrusters","العجلات والدافعات"),L("Three reaction wheels for pointing; small thrusters fired to shed their spin. Those firings were logged in the wrong units.","ثلاث عجلات رد فعل للتوجيه، ودافعات صغيرة لتفريغ دورانها. وسُجّلت إطلاقاتها بالوحدات الخطأ.")],[L("Antennas and instruments","الهوائيات والأجهزة"),L("A 1.3 m dish, a UHF radio for the lander, and two instruments: PMIRR and MARCI.","طبق 1.3 م، وراديو UHF للهبّاطة، وجهازان: PMIRR وMARCI.")]],
seq:[[L("Nine months","تسعة أشهر"),L("Wheel-spin releases are logged in the wrong units","تُسجَّل إطلاقات تفريغ العجلات بالوحدات الخطأ")],[L("September 1999","سبتمبر 1999"),L("Navigators see the path sinking lower than planned","يلاحظ الملاحون أن المسار أخفض من المخطط")],["09:00:46 UTC",L("The orbit burn begins","يبدأ حرق المدار")],["09:04:52 UTC",L("Signal lost 49 seconds early; about 57 km up, below the ~80 km it could survive","تنقطع الإشارة قبل موعدها بـ49 ثانية؛ على ارتفاع نحو 57 كم، أقل من 80 كم الذي تتحمله")]]});
A.push({id:"mpl",name:L("Mars Polar Lander","هبّاطة المريخ القطبية"),world:"Mars",type:"Lander",kind:"lander",mission:MS,period:"1999",status:L("Lost during landing — no signal received","فُقدت أثناء الهبوط — لم تصل أي إشارة"),
short:L("A lander meant to dig for water ice near the south pole, silent since its descent.","هبّاطة صُممت لتحفر بحثًا عن الجليد قرب القطب الجنوبي، وصمتت منذ هبوطها."),tag:L("Silent since its descent.","صامتة منذ هبوطها."),img:ART.mpl,credit:CR,
story:[L("Mars Polar Lander was built to land near the south pole of Mars and dig for water ice with a robotic arm. Two small probes, Deep Space 2, rode along to hit the ground and test new technology.","صُممت الهبّاطة «مارس بولار لاندر» لتحط قرب القطب الجنوبي للمريخ وتحفر بذراع آلية بحثًا عن جليد مائي. وحملت معها مسبارين صغيرين «ديب سبيس 2» لاصطدام بالسطح واختبار تقنية جديدة."),L("On December 3, 1999 it began its descent and went silent, as planned, before entry. No signal was heard afterwards. Review boards named a premature engine shutdown as the most probable cause.","في 3 ديسمبر 1999 بدأت الهبوط وصمتت قبل الدخول كما كان مخططًا، ولم تصل أي إشارة بعدها. ورجّحت لجان المراجعة أن السبب الأرجح هو إيقاف المحركات مبكرًا.")],
facts:[["Mission",MS],["Launch","January 3, 1999"],[L("Arrival","الوصول"),"December 3, 1999"],["Objective",L("Dig for water ice near the south pole","الحفر بحثًا عن جليد مائي قرب القطب الجنوبي")],[L("Mass","الكتلة"),L("About 290 kg (lander)","نحو 290 كجم (الهبّاطة)")],[L("Target","الهدف"),L("Near 76°S on Mars","قرب خط عرض 76° جنوبًا على المريخ")]],
how:[L("A cruise stage and aeroshell carried it in; a parachute slowed it. Then three legs unfolded and descent engines fired in pulses to land at about 2.4 m/s.","حملتها مرحلة الرحلة والغلاف الواقي وأبطأتها مظلة. ثم انفتحت ثلاث أرجل وعملت محركات الهبوط بنبضات لتلمس الأرض بسرعة نحو 2.4 م/ث."),L("Each leg held a magnetic sensor meant to say ‘touchdown’. The software was meant to ignore it until about 40 m above the ground.","في كل رجل حسّاس مغناطيسي يُفترض أن يعلن «لمسنا الأرض». وكان على البرنامج تجاهله حتى ارتفاع نحو 40 م عن السطح.")],
x:[[L("Twin probes","مسباران توأمان"),L("Two Deep Space 2 probes rode along, built to smash into the ground. Contact with both failed too.","رافقها مسباران «ديب سبيس 2» صُنعا للاصطدام بالأرض، وفُقد الاتصال بهما أيضًا.")],[L("Sensors versus software","الحسّاسات مقابل البرنامج"),L("The sensor blip showed up in tests; the flaw was software that did not ignore it.","ظهرت نبضة الحسّاس في الاختبارات؛ والخلل كان في برنامج لم يتجاهلها.")],[L("Hard to prove","يصعب إثباته"),L("It sent no data during landing, so the cause is the most probable finding, not a certainty.","لم ترسل بيانات أثناء الهبوط، فالسبب هو الأرجح وليس مؤكدًا.")]],

A.push({id:"lm",name:"هبّاطات أبولو القمرية (مراحل الهبوط)",world:"Moon",type:"مركبة هبوط",kind:"lander",mission:"برنامج أبولو",period:"1969 – 1972",status:"ست مراحل هبوط ما تزال على القمر",
short:"ست منصات إطلاق تركها روّاد أبولو على سطح القمر بعد أن عادت مراحل الصعود بهم.",tag:"ست قواعد صامتة على القمر.",img:ART.lm,credit:CR,
story:["بين يوليو 1969 وديسمبر 1972 هبطت ست مركبات قمرية على سطح القمر. تتألف كل منها من مرحلتين: مرحلة هبوط بمحرك كبير وأرجل، تعلوها مرحلة صعود صغيرة يعيش فيها الروّاد. وحين انتهت الأيام على السطح، أُشعل محرك مرحلة الصعود فارتفع الروّاد نحو المدار، وبقيت مرحلة الهبوط في مكانها تعمل منصة إطلاق.","لماذا تُركت؟ لأن كل كيلوغرام إضافي يحتاج وقودًا إضافيًا للعودة، ولا حاجة لمحرك الهبوط بعد أن أدّى مهمته. تُركت المرحلة لتخفيف الوزن ولتُفسح مكانًا لحمل عينات الصخور إلى الأرض. وما زالت هناك حتى اليوم، وقد صوّرها المسبار LRO من مداره بعد عقود، مع آثار أقدام الروّاد حولها."],
facts:[["البرنامج","أبولو (11 و12 و14 و15 و16 و17)"],["أول هبوط","July 20, 1969"],["آخر إقلاع","December 14, 1972"],["الموقع","ست مواقع على القمر"],["الغرض","إنزال الروّاد ثم العمل منصة إطلاق"],["الحالة","مراحل الهبوط ما تزال على السطح"]],
how:["تحمل مرحلة الهبوط المحرك الرئيسي وخزانات الوقود وأرجل الهبوط التي تمتص الصدمة، وتُبطئ المركبة حتى تلمس السطح بنعومة.","عند المغادرة لا يُنقل شيء منها: ينفصل الجزء العلوي بمحركه الخاص، وتعمل مرحلة الهبوط منصة إطلاق ثابتة. وما يُترك خلف الروّاد يصبح وزنًا لا يحتاج الصعود إلى حمله."],
x:[["مراحل الصعود","بعض مراحل الصعود أُسقطت عمدًا على القمر لتسجّل أجهزة الزلازل ارتطامها، فكشفت شيئًا عن باطن القمر."],["لوحة تذكارية","على مرحلة هبوط أبولو 11 لوحة كتب فيها الروّاد أنهم جاؤوا بسلام من أجل البشرية جمعاء."]],
tl:[["July 20, 1969","أبولو 11 تهبط في بحر السكون"],["July 21, 1969","تقلع مرحلة الصعود وتبقى مرحلة الهبوط"],["December 14, 1972","آخر إقلاع من القمر — أبولو 17"]],
disc:["صوّر المسبار LRO مواقع الهبوط من مداره، فظهرت مراحل الهبوط ومسارات الأقدام بعد عقود.","وتُعدّ هذه المواقع معالم تاريخية، وقد نشرت ناسا توصيات لحمايتها."],
rem:["ما زالت مراحل الهبوط الست في أماكنها، تحت حرارة النهار القمري الشديدة وبرد ليله وإشعاع الشمس.","أخذ الروّاد معهم الصخور فقط، وتركوا المنصات شاهدًا على أن البشر كانوا هنا."],src:[SRC]});
A.push({id:"huygens",name:"مسبار هويجنز",world:TT,type:"مسبار هبوط",kind:"lander",mission:"كاسيني–هويجنز",period:"1997 – 2005",status:"صامت على سطح تيتان منذ 2005",
short:"مسبار أوروبي هبط على تيتان، أبعد عالم هبطت عليه مركبة، وأرسل أول صور من سطحه.",tag:"أبعد هبوط في التاريخ.",img:ART.huygens,credit:CR,
story:["انطلق هويجنز مع مركبة كاسيني من الأرض في 15 أكتوبر 1997، وسافر نحو سبع سنوات ملتصقًا بها وهي تتجه إلى زحل. وفي 25 ديسمبر 2004 انفصل عنها وبدأ رحلته الأخيرة نحو تيتان، أكبر أقمار زحل وأكثرها غموضًا بغلافه الجوي الكثيف.","في 14 يناير 2005 اخترق الغلاف الجوي بدرع حراري ثم بمظلات، وهبط في نحو ساعتين ونصف. أرسل صورًا وقياسات للحرارة والضغط وعيّنات غازية عبر كاسيني. لكنه صُمم لهذا النزول فقط: لا ألواح شمسية ولا وقود للعودة. نفدت بطارياته فبقي صامتًا على سطح تيتان حتى اليوم."],
facts:[["المهمة","كاسيني–هويجنز (ناسا ووكالة الفضاء الأوروبية والإيطالية)"],["الإطلاق","October 15, 1997 (مع كاسيني)"],["الانفصال","December 25, 2004"],["الهبوط","January 14, 2005"],["الكتلة","نحو 318 كجم"],["الحالة","صامت؛ بقي على السطح"]],
how:["حماه درع حراري أثناء الدخول، ثم فُتحت مظلة رئيسية وتبعتها مظلة أصغر لتثبيت الهبوط وتقصير زمنه.","حملت الكبسولة ستة أجهزة: كاميرات ومطياف كتلة ومجسات للضغط والحرارة والصوت والرياح. وأُرسلت بياناتها إلى كاسيني الذي نقلها إلى الأرض."],
x:[["قناة راديو ضائعة","لم تُفعَّل إحدى قناتي الراديو بسبب خطأ في الأوامر، فضاعت بعض قياسات الرياح، لكن كاسيني نقل الباقي."],["عالم غريب مألوف","أظهرت الصور مجاري وسواحل تشبه الأنهار، لكنها منحوتة بالميثان لا بالماء، عند حرارة نحو −179 °م."]],
tl:[["October 15, 1997","كاسيني وهويجنز تنطلقان"],["December 25, 2004","هويجنز ينفصل عن كاسيني"],["January 14, 2005","يهبط على تيتان ويرسل بياناته"],["September 15, 2017","كاسيني تنهي مهمتها بالغوص في زحل"]],
disc:["كشف أن لتيتان غلافًا كثيفًا من النيتروجين، وأن الميثان يعمل فيه عمل الماء على الأرض.","وكانت صوره أول صور من سطح عالم في المنظومة الشمسية الخارجية."],
rem:["ما زال هويجنز على سطح تيتان في موضع هبوطه، لم يُصمَّم ليعمل بعد النزول.","وهو أبعد قطعة صنعها البشر على سطح عالم آخر."],
src:[["ESA — Cassini-Huygens","https://www.esa.int/Science_Exploration/Space_Science/Cassini-Huygens"],SRC],
eng:[["درع حراري","حمى الكبسولة من حرارة الدخول في غلاف تيتان."],["مظلات","مظلتان متتاليتان قلّلتا السرعة وثبّتتا الكبسولة."],["ستة أجهزة","كاميرا ومطياف كتلة ومجسّات ضغط وحرارة ورياح وصوت."],["مرسل الراديو","أرسل البيانات إلى كاسيني الذي نقلها إلى الأرض."]],
seq:[["الدخول","درع حراري يبطئ الكبسولة في الغلاف الجوي"],["المظلة","تُفتح المظلات ويبدأ الهبوط الطويل"],["ساعتان ونصف","يقيس الجو ويلتقط الصور أثناء الهبوط"],["السطح","يلمس تيتان ويواصل الإرسال 72 دقيقة على الأقل"]]});
A.push({id:"mir",name:"محطة الفضاء مير",world:EA,type:"محطة فضائية",kind:"station",mission:"البرنامج السوفييتي ثم الروسي",period:"1986 – 2001",status:"أُسقطت عمدًا في المحيط الهادئ",

story:["أُطلقت الوحدة الأساسية لمير في 19 فبراير 1986، ثم كبرت وحدةً بعد وحدة حتى صارت مجمّعًا زاره روّاد من دول كثيرة. وأقام فيها روّاد أرقامًا قياسية للبقاء في الفضاء.","في التسعينات تقادمت أنظمتها وتراكمت الأعطال: حريق على متنها في فبراير 1997، واصطدام مركبة إمداد بوحدة «سبكترا» في يونيو من العام نفسه. وصار تشغيلها أصعب وأغلى، فقررت روسيا إنهاءها. وفي 23 مارس 2001 أشعلت مركبة إمداد محركاتها لتخفض مدار المحطة، فاحترق معظمها في الغلاف الجوي وسقطت البقايا في جنوب المحيط الهادئ بعيدًا عن اليابسة."],
facts:[["الإطلاق","February 19, 1986"],["إنهاء المهمة","March 23, 2001"],["الكتلة","نحو 120 طنًا"],["الموقع","مدار منخفض حول الأرض"],["سبب الإنهاء","تقادم وكلفة تشغيل"],["الحالة","احترقت وسقطت بقاياها في المحيط الهادئ"]],
how:["بُنيت مير من وحدات تُطلق كلٌّ على حدة وتلتحم بالوحدة الأساسية عبر منافذ التحام.","كانت تُمَدّ بمركبات «بروغرس» الآلية ويخدمها طاقمها بمركبات «سويوز». وفي النهاية استُخدمت «بروغرس» لإبطائها وإنزالها."],
x:[["مقبرة المركبات","منطقة نائية من جنوب المحيط الهادئ تُوجَّه إليها المركبات الكبيرة لتسقط بعيدًا عن البشر."],["سكاي لاب","محطة ناسا الأولى عادت بلا تحكم في 11 يوليو 1979، وتناثر حطامها فوق المحيط الهندي وغرب أستراليا."]],

 const body=world==='Moon'?'#d9d4ca':'#e6b17f';

function worldJourney(world){
 const items=[...A.filter(a=>a.world===world).map(a=>({...a,n:a.name,period:a.period,kind:a.type,detail:a.short})),...F.filter(f=>f.w===world).map(f=>({...f,name:f.n,period:f.y,kind:f.t,detail:f.d}))];
 const slug=world.toLowerCase(),arab=world==='Moon'?'القمر':'المريخ';
 const intro=world==='Moon'?'عالم هادئ مليء بالفوهات والغبار، تركت عليه بعثات أبولو ومركبات الروبوت آثارًا لا تزال تحكي قصص الاستكشاف.':'عالم أحمر بارد، عبرت سهوله وفوهاته مركبات جوالة وهابطات ومدارات تبحث عن الماء وأسرار الماضي.';
 const steps=items.map((it,i)=>{const copy=kidCopy(it,world);const facts=[it.period,it.kind,it.status||it.c||'مهمة فضائية'];return `<article class="journey-step" data-step="${i}"><span class="step-no">${L('EXPLORER','المستكشف')} ${String(i+1).padStart(2,'0')} / ${String(items.length).padStart(2,'0')}</span><h3>${it.name}</h3><div class="mini-facts">${facts.map(x=>`<span>${x}</span>`).join('')}</div><p class="kid">${L(it.detail||it.short||'A robotic explorer helped scientists study this world.',copy[0])}</p><div class="fun">✨ ${L('Fun fact: Every mission taught scientists something new.',copy[1])}</div><a class="story-link" href="#/${it.id&&A.some(a=>a.id===it.id)?'artifact':'fleet'}/${it.id}">${L('Open the full mission story','افتح قصة المهمة كاملة')} ←</a></article>`}).join('');
 return `<section class="world-intro ${slug}"><div class="planet-big" aria-hidden="true"></div><div class="intro-copy"><span class="lbl">${L('PLANETARY FIELD JOURNAL','دفتر الرحلات الكوكبية')}</span><h1>${L('Welcome to the','مرحبًا بك على')} <em>${L(world,arab)}</em></h1><p>${L(intro,intro)}</p><div class="scroll-cue">${L('SCROLL TO LAND','مرّر للأسفل للهبوط')}<i></i></div></div></section><section class="journey"><div class="journey-head"><span class="idx">${L('SURFACE EXPLORATION','استكشاف السطح')}</span><h2>${L('Meet the explorers','تعرّف على المستكشفين')}</h2><p>${L('Scroll one step at a time. Each stop introduces a machine and one amazing thing it discovered.','انزل خطوة بخطوة. في كل محطة ستقابل مركبة وتكتشف معلومة مدهشة عنها.')}</p></div><div class="journey-grid"><div class="journey-visual ${slug}"><div class="stars"></div><div class="visual-label"><span>${L(world,arab).toUpperCase()}</span><span class="visual-count">01 / ${String(items.length).padStart(2,'0')}</span></div><div class="horizon"></div><div class="terrain"></div><div class="vehicle-art">${roverSvg('rover',world)}</div><div class="dust"></div></div><div class="journey-steps">${steps}</div></div><div class="journey-end"><h2>${L('Mission accomplished!','أحسنت يا مستكشف!')}</h2><p>${L('You have explored the machines that helped us understand this world.','لقد تعرّفت على المركبات التي ساعدتنا على فهم هذا العالم.')}</p><a class="btn" href="#/explore">${L('Choose another world','اختر عالمًا آخر')} ←</a></div></section><div class="journey-progress"><span class="progress-text">01 / ${String(items.length).padStart(2,'0')}</span><span class="track"><i></i></span><span>${L('EXPLORERS','المستكشفون')}</span></div>`;
}

R.home=()=>`<div class="hh"><div class="w"><span class="lbl">NASA missions · Moon and Mars</span><h1>They Came.<br>They Explored.<br><span>They Remain.</span></h1><p class="s">A digital archive of NASA’s remarkable missions and the machines that made them possible.</p><a class="btn" href="#/explore">Explore Artifacts →</a>
<div class="grid" style="margin-top:150px">${A.map(hcard).join("")}</div></div></div>
<div class="lg"><div class="w"><svg width="130" height="50" viewBox="0 0 130 50" fill="none" stroke="#FF9A3C" stroke-width="2" aria-hidden="true"><ellipse cx="62" cy="26" rx="58" ry="14" transform="rotate(-8 62 26)"/><circle cx="118" cy="30" r="4" fill="#FF9A3C"/></svg><h2>More Than Machines.<em>A Legacy for the Future.</em></h2><div class="d">Explore how these forgotten explorers helped us understand our universe.</div><a class="btn" href="#/about">About ECHOES →</a></div></div>
<section><div class="w"><span class="idx">01 — HOW TO READ THIS ARCHIVE</span><h2>Four kinds of legacy</h2><p class="sub">Not every machine left behind is the same. ECHOES separates them so nothing is overstated.</p>
<div class="g4"><div class="st"><span class="dot" style="background:var(--ac)"></span><h3>Active</h3><p>Still operating and communicating with Earth.</p></div><div class="st"><span class="dot" style="background:var(--moon)"></span><h3>Passive</h3><p>Needs no power, yet can still be used for measurements, like the Apollo 11 reflector.</p></div><div class="st"><span class="dot" style="background:var(--mars)"></span><h3>Inactive</h3><p>No longer communicating, and remaining where it stopped.</p></div><div class="st"><span class="dot" style="background:var(--mu)"></span><h3>Mission complete</h3><p>Formally ended by NASA, after the planned goals were met or contact was lost.</p></div></div></div></section>
<section class="alt"><div class="w"><span class="idx">02 — HOW A MIRROR MEASURES THE MOON</span><h2>Anatomy of a laser echo</h2><p class="sub">The Apollo 11 retroreflector has no power and sends nothing. The measurement starts on Earth.</p>
<svg viewBox="0 0 800 210" role="img" aria-label="A laser pulse travels from an Earth observatory to the Moon reflector and back" style="width:100%;max-width:920px"><defs><radialGradient id="eg"><stop offset="0" stop-color="#5b9bff"/><stop offset="1" stop-color="#0f2a57"/></radialGradient></defs><circle cx="90" cy="100" r="62" fill="url(#eg)"/><circle cx="700" cy="100" r="30" fill="#D9B8FF"/><rect x="662" y="96" width="9" height="9" fill="#FF9A3C"/><line x1="152" y1="100" x2="660" y2="100" stroke="#8B5CF6" stroke-dasharray="4 6"/><circle r="6" cy="100"><animate attributeName="cx" values="152;660;152" keyTimes="0;.5;1" dur="5s" repeatCount="indefinite"/><animate attributeName="fill" values="#FF9A3C;#FF9A3C;#ffffff;#ffffff" keyTimes="0;.49;.5;1" calcMode="discrete" dur="5s" repeatCount="indefinite"/></circle>
<g fill="#DCCCF5" font-size="14" text-anchor="middle"><text x="90" y="195">Earth observatory</text><text x="690" y="195">Reflector on the Moon</text><text x="410" y="80">Time the round trip → get the distance</text><text x="410" y="205" font-size="12">Not to scale</text></g></svg>
<div class="steps"><div><b>1 · Fire</b>A telescope sends a short laser pulse toward the reflector.</div><div><b>2 · Return</b>Corner cubes send the light back toward its source.</div><div><b>3 · Measure</b>Scientists time the trip and calculate the Earth–Moon distance.</div></div></div></section>
<section><div class="w"><span class="idx">03 — TWO WORLDS</span><h2>What was left behind</h2><div class="g2" style="margin-top:20px"><div class="panel"><h3 class="Moon">On the Moon</h3><ul><li>The Apollo 11 laser retroreflector (1969)</li><li>Science stations from later Apollo missions</li><li>Three Lunar Roving Vehicles</li></ul><a class="link" href="#/fleet/lrv">See Moon spacecraft →</a></div><div class="panel"><h3 class="Mars">On Mars</h3><ul><li>Viking 1 (1976) and Sojourner with Pathfinder (1997)</li><li>Spirit and Opportunity (2004), Phoenix (2008), InSight (2018)</li><li>Curiosity and Perseverance, which NASA lists among its Mars surface missions</li></ul><a class="link" href="#/fleet/viking1">See Mars spacecraft →</a></div></div></div></section>
<section class="alt"><div class="w"><span class="idx">04 — A LINEAGE OF MARS ROVERS</span><h2>Each landing built on the last</h2><div class="lin"><div><i>JULY 4, 1997</i><b>Sojourner</b>Proved a rover could work on Mars.</div><div><i>JANUARY 2004</i><b>Spirit and Opportunity</b>Geology robots searching for evidence of past water.</div><div><i>AUGUST 2012</i><b>Curiosity</b>Showed that Gale Crater once had habitable conditions.</div><div><i>FEBRUARY 18, 2021</i><b>Perseverance</b>Searches for signs of ancient life and collects samples.</div></div></div></section>
<section><div class="w"><span class="idx">05 — BEYOND THE THREE</span><h2>Fourteen more spacecraft</h2><p class="sub">Orbiters, landers and rovers that share the story of the Moon and Mars.</p><div class="chips">${F.map(f=>`<a class="chip" href="#/fleet/${f.id}">${f.n}</a>`).join("")}</div><a class="btn" href="#/fleet">Open the Fleet →</a></div></section>
<section class="alt"><div class="w"><span class="idx">06 — SOURCES</span><h2>Where the facts come from</h2><div class="grid"><a class="card" href="https://science.nasa.gov/" target="_blank" rel="noopener"><div class="b"><h3>NASA Science</h3><p>Mission pages and updates for Mars, the Moon and more.</p></div></a><a class="card" href="https://www.jpl.nasa.gov/" target="_blank" rel="noopener"><div class="b"><h3>NASA JPL</h3><p>Rover and orbiter missions, built and operated at JPL.</p></div></a><a class="card" href="https://images.nasa.gov/" target="_blank" rel="noopener"><div class="b"><h3>NASA Image Library</h3><p>Official photographs to replace the concept images here.</p></div></a></div></div></section>`;
R.fleet=()=>`<section><div class="w"><h1 style="font-size:clamp(34px,5vw,56px);margin:0 0 12px">The Fleet</h1><p class="sub">Fourteen more spacecraft from the Moon and Mars. Tap a card for details.</p>
<div class="filters">${[["all","All"],["Moon","Moon"],["Mars","Mars"],["Orbiter","Orbiters"],["surf","Landers and rovers"],["active","Operating"],["ended","Ended"]].map((f,i)=>`<button data-g="${f[0]}" class="${i?"":"on"}" aria-pressed="${!i}">${f[1]}</button>`).join("")}</div><div id="fl" class="grid"></div><p class="meta" style="margin-top:24px">Statuses reflect the sources listed; confirm current status on NASA pages.</p></div></section>`;

function fillF(g){const l=F.filter(f=>g=="all"||f.w==g||f.t==g||(g=="surf"&&["Lander","Rover","Vehicle","Surface station"].includes(f.t))||(g=="active"&&f.c=="active")||(g=="ended"&&["inactive","complete"].includes(f.c)));$("#fl").innerHTML=l.length?l.map(fcard).join(""):`<div class="empty" style="grid-column:1/-1">No spacecraft match this filter.</div>`}
R.about=()=>`<section><div class="w"><h1 style="font-size:clamp(34px,5vw,56px);margin:0 0 16px">About ECHOES</h1><div class="two"><div><span class="idx">MISSION</span><p style="color:var(--tx2)">ECHOES is an independent educational digital archive created to tell the stories of NASA equipment left on the Moon and Mars.</p></div>
<div><h3>Goals</h3><ul style="color:var(--tx2)"><li>Make space exploration history easier to understand.</li><li>Explain the engineering behind historic exploration equipment.</li><li>Highlight scientific discoveries.</li><li>Preserve the stories of machines that contributed to space exploration.</li></ul>
<h3>How we research</h3><p style="color:var(--tx2)">Facts are drawn from NASA, NASA JPL and official science organizations. Where a detail cannot be verified, it is left out or marked as something to confirm.</p></div></div></div></section>
<section class="alt"><div class="w"><span class="idx">GLOSSARY</span><h2>Key terms</h2><div class="gl"><div><b>Sol</b>One Martian day, slightly longer than an Earth day.</div><div><b>Retroreflector</b>A device that returns light toward its source.</div><div><b>Corner cube</b>Three mirror surfaces at right angles that reflect light back parallel to its incoming path.</div><div><b>Lunar laser ranging</b>Measuring the Earth–Moon distance by timing laser pulses.</div><div><b>Orbiter / Lander / Rover</b>Circles a world / sits where it landed / drives across the surface.</div></div></div></section>
